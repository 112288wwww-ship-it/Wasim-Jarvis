<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>WASIM KHAN JARVIS AI</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020817;font-family:Arial}
.screen{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,calc(100dvh * 1229 / 1280));aspect-ratio:1229/1280}
.screen img{width:100%;height:100%;display:block;object-fit:contain}
.hot{position:absolute;border:0;background:transparent;padding:0;z-index:5}
.hot:active{background:#42baff22}
.settings{left:3%;top:8%;width:19%;height:15%}
.time{left:2%;top:31%;width:18%;height:13%}
.date{left:2%;top:46%;width:18%;height:13%}
.chrome{right:2%;top:27%;width:19%;height:14%}
.youtube{right:2%;top:43%;width:19%;height:14%}
.history{right:2%;top:59%;width:19%;height:14%}
.mic{left:36%;top:58%;width:28%;height:22%;border-radius:50%}

/* JARVIS voice animations */
.voice-bars{position:absolute;left:29%;top:81%;width:42%;height:7%;z-index:4;display:flex;align-items:center;justify-content:space-around;opacity:.18;pointer-events:none}
.voice-bars span{width:3px;height:18%;border-radius:8px;background:#43eaff;box-shadow:0 0 8px #00cfff}
body.listening .voice-bars,body.speaking .voice-bars{opacity:1}
body.listening .voice-bars span,body.speaking .voice-bars span{animation:voiceWave .65s ease-in-out infinite alternate}
.voice-bars span:nth-child(2n){animation-delay:.2s}
.voice-bars span:nth-child(3n){animation-delay:.4s}
@keyframes voiceWave{from{height:15%}to{height:100%}}
.eye-lid{position:absolute;z-index:3;height:1.1%;width:5.2%;border-radius:50%;background:rgba(8,18,35,.82);opacity:0;pointer-events:none;animation:eyeBlink 5s infinite}
.eye-lid.one{left:44%;top:20.7%}
.eye-lid.two{left:56.2%;top:20.7%;animation-delay:.08s}
@keyframes eyeBlink{0%,92%,96%,100%{opacity:0;transform:scaleY(.1)}94%{opacity:.9;transform:scaleY(1)}}
.mouth-motion{position:absolute;z-index:3;left:49.5%;top:28.7%;width:6.5%;height:1.5%;border-radius:50%;background:rgba(100,0,25,.18);opacity:0;pointer-events:none}
body.speaking .mouth-motion{opacity:.8;animation:mouthTalk .22s ease-in-out infinite alternate}
@keyframes mouthTalk{from{transform:scaleY(.35)}to{transform:scaleY(1.5)}}

#tools{position:fixed;z-index:20;left:5%;right:5%;bottom:12px;max-height:65vh;overflow:auto;padding:13px;border:1px solid #d7ae55;border-radius:16px;background:#071a31;color:white;display:none;box-shadow:0 0 20px #168bff}
#tools.open{display:block}
#tools input,#tools select{width:100%;padding:12px;margin:5px 0;border-radius:9px;background:#061629;color:white;border:1px solid #48a9e8}
#tools button{padding:10px;border-radius:9px;background:#1255a0;color:white;border:1px solid #d7ae55}
#answer{white-space:pre-wrap;line-height:1.4;padding:8px}
#closeTools{float:right}
</style>
</head>
<body>
<div class="screen">
<img src="jarvis-main-design.png" alt="WASIM KHAN JARVIS AI full screen design">
<button class="hot settings" aria-label="Settings" onclick="openTools()"></button>
<button class="hot time" aria-label="Time" onclick="quick('time')"></button>
<button class="hot date" aria-label="Date" onclick="quick('date')"></button>
<button class="hot chrome" aria-label="Chrome" onclick="quick('chrome')"></button>
<button class="hot youtube" aria-label="YouTube" onclick="quick('youtube')"></button>
<button class="hot history" aria-label="History" onclick="showHistory()"></button>
<button class="hot mic" aria-label="Microphone" onclick="startMic()"></button>
<div class="eye-lid one"></div><div class="eye-lid two"></div>
<div class="mouth-motion"></div>
<div class="voice-bars" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
</div>
<section id="tools">
<button id="closeTools" onclick="closeTools()">CLOSE ✕</button>
<h3>WASIM KHAN JARVIS AI</h3>
<input id="message" placeholder="Ask JARVIS anything...">
<button onclick="sendMessage()">SEND ➤</button>
<button onclick="speakAnswer()">SPEAK 🔊</button>
<div id="answer">میں تیار ہوں۔</div>
<hr>
<h3>GROQ API SETTINGS</h3>
<input id="apiKey" type="password" placeholder="Groq API Key">
<button onclick="saveKey()">SAVE API KEY</button>
<p id="keyStatus">API Key सेव करें</p>
<select id="language">
<option value="ur-PK">اردو — Urdu</option>
<option value="hi-IN">हिन्दी — Hindi</option>
<option value="en-US">English</option>
<option value="ar-SA">العربية — Arabic</option>
<option value="bn-BD">বাংলা — Bengali</option>
<option value="pa-IN">ਪੰਜਾਬੀ — Punjabi</option>
<option value="ps-PK">پښتو — Pashto</option>
<option value="fa-IR">فارسی — Persian</option>
<option value="tr-TR">Türkçe — Turkish</option>
<option value="fr-FR">Français — French</option>
<option value="de-DE">Deutsch — German</option>
<option value="es-ES">Español — Spanish</option>
<option value="pt-BR">Português — Portuguese</option>
<option value="ru-RU">Русский — Russian</option>
<option value="zh-CN">中文 — Chinese</option>
<option value="ja-JP">日本語 — Japanese</option>
<option value="ko-KR">한국어 — Korean</option>
<option value="it-IT">Italiano — Italian</option>
<option value="nl-NL">Nederlands — Dutch</option>
<option value="pl-PL">Polski — Polish</option>
<option value="uk-UA">Українська — Ukrainian</option>
<option value="id-ID">Bahasa Indonesia</option>
<option value="ms-MY">Bahasa Melayu — Malay</option>
<option value="th-TH">ไทย — Thai</option>
<option value="vi-VN">Tiếng Việt — Vietnamese</option>
<option value="sw-KE">Kiswahili — Swahili</option>
<option value="ta-IN">தமிழ் — Tamil</option>
<option value="te-IN">తెలుగు — Telugu</option>
<option value="mr-IN">मराठी — Marathi</option>
<option value="gu-IN">ગુજરાતી — Gujarati</option>
<option value="ne-NP">नेपाली — Nepali</option>
<option value="si-LK">සිංහල — Sinhala</option>
<option value="fil-PH">Filipino</option>
<option value="ha-NG">Hausa</option>
<option value="yo-NG">Yorùbá</option>
<option value="am-ET">አማርኛ — Amharic</option>
<option value="el-GR">Ελληνικά — Greek</option>
<option value="he-IL">עברית — Hebrew</option>
<option value="sv-SE">Svenska — Swedish</option>
<option value="da-DK">Dansk — Danish</option>
<option value="fi-FI">Suomi — Finnish</option>
<option value="no-NO">Norsk — Norwegian</option>
<option value="ro-RO">Română — Romanian</option>
<option value="hu-HU">Magyar — Hungarian</option>
<option value="cs-CZ">Čeština — Czech</option>
</select>
<select id="voiceChoice">
<option value="default">Default Voice</option>
<option value="male">Male Voice</option>
<option value="female" selected>Female Voice</option>
</select>
<label>फोन की वास्तविक आवाज़ चुनें</label>
<select id="nativeVoiceChoice">
<option value="">Male/Female विकल्प इस्तेमाल करें</option>
</select>
<button onclick="loadNativeVoices()">↻ REFRESH VOICES</button>
<div id="voiceStudio" style="margin:12px;padding:12px;border:1px solid #48a9e8;border-radius:12px;background:#061629;color:white">
<h3>🎙️ JARVIS VOICE STUDIO</h3>
<label>Voice Type</label>
<p id="voiceTypeLabel">ऊपर दिए Voice Type विकल्प से आवाज़ चुनें।</p>
<label>Voice Speed: <span id="speedValue">1</span></label>
<input id="voiceSpeed" type="range" min="0.7" max="1.4" step="0.1" value="1">
<label>Voice Pitch: <span id="pitchValue">1</span></label>
<input id="voicePitch" type="range" min="0.7" max="1.4" step="0.1" value="1">
<button onclick="previewVoice()">▶ PREVIEW VOICE</button>
<button onclick="toggleVoiceFavorite()">☆ FAVORITE</button>
<p id="voiceStatus">Offline Android Voice</p>
</div>
</section>
<script>
let lastAnswer = "";

function quick(x){
 if(x==="time" || x==="date"){
  let now=new Date();
  lastAnswer=x==="time" ? "अभी समय है: "+now.toLocaleTimeString() : "आज की तारीख: "+now.toLocaleDateString();
  document.getElementById("answer").textContent=lastAnswer;
  speakAnswer();
  return;
 }
 document.getElementById("message").value=x;
 sendMessage();
}

function saveKey(){
 let key=document.getElementById("apiKey").value.trim();
 if(!key){alert("पहले API Key डालें");return;}
 if(window.Android && typeof Android.saveApiKey==="function"){
  let ok=Android.saveApiKey(key);
  document.getElementById("keyStatus").textContent=ok?"API Key सेव हो गई।":"सेव नहीं हुई।";
 }else{
  document.getElementById("keyStatus").textContent="Chrome में Key सेव नहीं होगी। इसे Termux Server में सेट करें।";
 }
 document.getElementById("apiKey").value="";
}

window.onJarvisReply = function(raw){
 try{
  let d=JSON.parse(raw);
  lastAnswer=d.reply||"AI से जवाब नहीं मिला।";
  document.getElementById("answer").textContent=lastAnswer;
  if(!d.needsKey)setTimeout(speakAnswer,300);
 }catch(e){
  document.getElementById("answer").textContent="AI जवाब पढ़ने में समस्या: "+e.message;
 }
};

function sendMessage(){
 let message=document.getElementById("message").value.trim();
 if(!message)return;

 let command=message.toLowerCase();
 let apps=[
  {words:["whatsapp","व्हाट्सएप","व्हाट्सऐप"],name:"whatsapp"},
  {words:["youtube","यूट्यूब"],name:"youtube"},
  {words:["chrome","क्रोम"],name:"chrome"},
  {words:["camera","कैमरा"],name:"camera"},
  {words:["settings","setting","सेटिंग"],name:"settings"}
 ];

 for(let app of apps){
  if(app.words.some(word=>command.includes(word))){
   try{
    if(window.Android && typeof Android.openApp==="function"){
     lastAnswer=Android.openApp(app.name);
     document.getElementById("answer").textContent=lastAnswer;
     if(typeof Android.speak==="function"){
      Android.speak(lastAnswer,document.getElementById("language").value,"default");
     }
    }else{
     let urls={
      whatsapp:"https://web.whatsapp.com/",
      youtube:"https://www.youtube.com/",
      chrome:"https://www.google.com/"
     };
     if(urls[app.name]){
      lastAnswer=app.name==="chrome"?"Google खोल रहा हूँ।":app.name==="youtube"?"YouTube खोल रहा हूँ।":"WhatsApp Web खोल रहा हूँ।";
      document.getElementById("answer").textContent=lastAnswer;
      window.open(urls[app.name],"_blank","noopener");
     }else{
      lastAnswer="यह सुविधा केवल Android ऐप में उपलब्ध है।";
      document.getElementById("answer").textContent=lastAnswer;
     }
    }
   }catch(e){
    document.getElementById("answer").textContent="ऐप खोलने में समस्या आई: "+e.message;
   }
   document.getElementById("message").value="";
   return;
  }
 }

 let language=document.getElementById("language").value;
 try{
  if(window.Android && typeof Android.chatAsync==="function"){
   document.getElementById("answer").textContent="JARVIS जवाब तैयार कर रही है...";
   Android.chatAsync(message,language);
   document.getElementById("message").value="";
   return;
  }
  if(window.Android && typeof Android.chat==="function"){
   let d=JSON.parse(Android.chat(message,language));
   lastAnswer=d.reply;
   document.getElementById("answer").textContent=d.reply;
   if(!d.needsKey)setTimeout(speakAnswer,300);
  }else{
   document.getElementById("answer").textContent="JARVIS जवाब तैयार कर रहा है...";
   fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message:message,language:language})
   })
   .then(async r=>{
    let d=await r.json();
    if(!r.ok)throw new Error(d.reply||"AI सर्वर में समस्या");
    return d;
   })
   .then(d=>{
    lastAnswer=d.reply;
    document.getElementById("answer").textContent=lastAnswer;
    speakAnswer();
   })
   .catch(e=>{
    document.getElementById("answer").textContent=e.message;
   });
  }
 }catch(e){
  document.getElementById("answer").textContent="ऐप में समस्या आई: "+e.message;
 }
}


function getVoiceSettings(){
 return {
  speed: Number(document.getElementById("voiceSpeed").value),
  pitch: Number(document.getElementById("voicePitch").value)
 };
}

function updateVoiceSettings(){
 let v=getVoiceSettings();
 document.getElementById("speedValue").textContent=v.speed.toFixed(1);
 document.getElementById("pitchValue").textContent=v.pitch.toFixed(1);
 localStorage.setItem("jarvisVoiceSpeed",v.speed);
 localStorage.setItem("jarvisVoicePitch",v.pitch);
}

function loadNativeVoices(retry=0){
 let select=document.getElementById("nativeVoiceChoice");
 let saved=localStorage.getItem("jarvisNativeVoice")||"";
 select.innerHTML='<option value="">Male/Female विकल्प इस्तेमाल करें</option>';
 try{
  if(!window.Android || typeof Android.getAvailableVoices!=="function"){
   document.getElementById("voiceStatus").textContent="Native Voice API उपलब्ध नहीं";
   return;
  }
  let voices=JSON.parse(Android.getAvailableVoices()||"[]");
  voices.sort((a,b)=>(a.language+a.name).localeCompare(b.language+b.name));
  if(!voices.length && retry<5){
   document.getElementById("voiceStatus").textContent="फोन का Voice Engine तैयार हो रहा है...";
   setTimeout(()=>loadNativeVoices(retry+1),1500);
   return;
  }
  voices.forEach(voice=>{
   let option=document.createElement("option");
   option.value=voice.name;
   option.textContent=voice.name+" — "+voice.language+(voice.networkRequired?" (Online)":" (Offline)");
   select.appendChild(option);
  });
  if(saved && [...select.options].some(o=>o.value===saved))select.value=saved;
  document.getElementById("voiceStatus").textContent=
   voices.length ? voices.length+" फोन की आवाज़ें मिलीं" : "आवाज़ें नहीं मिलीं। Refresh दबाएँ।";
 }catch(e){
  document.getElementById("voiceStatus").textContent="Voice List पढ़ने में समस्या";
 }
}
document.getElementById("nativeVoiceChoice").addEventListener("change",function(){
 localStorage.setItem("jarvisNativeVoice",this.value);
 document.getElementById("voiceStatus").textContent=this.value?
  "चुनी गई आवाज़: "+this.value:"Male/Female विकल्प सक्रिय";
});

function speakNative(text,language,choice,v){
 let voiceName=document.getElementById("nativeVoiceChoice").value;
 if(window.Android && typeof Android.speakWithVoice==="function"){
  Android.speakWithVoice(text,language,choice,v.speed,v.pitch,voiceName);
 }else if(window.Android && typeof Android.speakAdvanced==="function"){
  Android.speakAdvanced(text,language,choice,v.speed,v.pitch);
 }
}

function previewVoice(){
 let language=document.getElementById("language").value;
 let choice=document.getElementById("voiceChoice").value;
 let v=getVoiceSettings();
 let sample="नमस्ते वसीम बॉस, मैं आपकी JARVIS हूँ।";
 document.getElementById("voiceStatus").textContent="आवाज़ का नमूना चल रहा है...";
 if(window.Android && typeof Android.speakAdvanced==="function"){
  speakNative(sample,language,choice==="default"?"female":choice,v);
 }else if("speechSynthesis" in window){
  let u=new SpeechSynthesisUtterance(sample);
  u.lang=language;u.rate=v.speed;u.pitch=v.pitch;
  u.onend=()=>document.getElementById("voiceStatus").textContent="Preview पूरा हुआ";
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(u);
 }else{
  document.getElementById("voiceStatus").textContent="आवाज़ उपलब्ध नहीं है";
 }
}

function toggleVoiceFavorite(){
 let choice=document.getElementById("voiceChoice").value;
 let saved=localStorage.getItem("jarvisFavoriteVoice");
 let button=document.querySelector("#voiceStudio button[onclick='toggleVoiceFavorite()']");
 if(saved===choice){
  localStorage.removeItem("jarvisFavoriteVoice");
  button.textContent="☆ FAVORITE";
  document.getElementById("voiceStatus").textContent="Favorite हटाया गया";
 }else{
  localStorage.setItem("jarvisFavoriteVoice",choice);
  button.textContent="★ FAVORITE SAVED";
  document.getElementById("voiceStatus").textContent="पसंदीदा आवाज़ सेव हो गई";
 }
}

function speakAnswer(){
 if(!lastAnswer)return;
 let language=document.getElementById("language").value;
 let choice=document.getElementById("voiceChoice").value;
 let v=getVoiceSettings();
 document.body.classList.remove("listening");
 document.body.classList.add("speaking");
 if(window.Android && typeof Android.speakAdvanced==="function"){
  speakNative(lastAnswer,language,choice==="default"?"female":choice,v);
  setTimeout(()=>document.body.classList.remove("speaking"),Math.max(2200,lastAnswer.length*75));
 }else if("speechSynthesis" in window){
  window.speechSynthesis.cancel();
  let utterance=new SpeechSynthesisUtterance(lastAnswer);
  utterance.lang=language;
  utterance.rate=v.speed;
  utterance.pitch=v.pitch;
  let voices=window.speechSynthesis.getVoices();
  let female=voices.find(v=>v.lang.toLowerCase().startsWith(language.slice(0,2).toLowerCase()) &&
   /female|woman|zira|samantha|susan|google.*female/i.test(v.name));
  if(female)utterance.voice=female;
  utterance.onstart=()=>document.body.classList.add("speaking");
  utterance.onend=()=>document.body.classList.remove("speaking");
  utterance.onerror=()=>document.body.classList.remove("speaking");
  window.speechSynthesis.speak(utterance);
 }else{
  document.body.classList.remove("speaking");
 }
}

loadNativeVoices();
setTimeout(loadNativeVoices,2000);
document.getElementById("voiceSpeed").addEventListener("input",updateVoiceSettings);
document.getElementById("voicePitch").addEventListener("input",updateVoiceSettings);
(function loadVoiceSettings(){
 let speed=localStorage.getItem("jarvisVoiceSpeed");
 let pitch=localStorage.getItem("jarvisVoicePitch");
 if(speed)document.getElementById("voiceSpeed").value=speed;
 if(pitch)document.getElementById("voicePitch").value=pitch;
 let favorite=localStorage.getItem("jarvisFavoriteVoice");
 if(favorite){
  document.getElementById("voiceChoice").value=favorite;
  document.querySelector("#voiceStudio button[onclick='toggleVoiceFavorite()']").textContent="★ FAVORITE SAVED";
 }
 updateVoiceSettings();
})();

function startMic(){
 if(window.Android && typeof Android.startNativeSpeech==="function"){
  document.body.classList.remove("speaking");
  document.body.classList.add("listening");
  document.getElementById("answer").textContent="Microphone शुरू हो रहा है...";
  try{
   Android.startNativeSpeech(document.getElementById("language").value);
  }catch(e){
   document.body.classList.remove("listening");
   document.getElementById("answer").textContent="Microphone शुरू नहीं हुआ: "+e.message;
  }
  return;
 }
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  document.getElementById("answer").textContent="इस Chrome में Speech Recognition उपलब्ध नहीं है। Chrome अपडेट करें।";
  return;
 }
 let recognition=new SpeechRecognition();
 recognition.lang=document.getElementById("language").value;
 recognition.continuous=false;
 recognition.interimResults=false;
 recognition.onstart=()=>{
  document.body.classList.add("listening");
  document.getElementById("answer").textContent="JARVIS सुन रही है...";
 };
 recognition.onresult=(event)=>{
  let spoken=event.results[0][0].transcript;
  document.getElementById("message").value=spoken;
  document.body.classList.remove("listening");
  sendMessage();
 };
 recognition.onerror=(event)=>{
  document.body.classList.remove("listening");
  document.getElementById("answer").textContent="Microphone समस्या: "+event.error+"। Chrome में Microphone अनुमति जाँचें।";
 };
 recognition.onend=()=>{
  document.body.classList.remove("listening");
 };
 try{
  recognition.start();
 }catch(e){
  document.body.classList.remove("listening");
  document.getElementById("answer").textContent="Microphone शुरू नहीं हुआ: "+e.message;
 }
}

window.onNativeSpeechStatus=function(message){
 document.getElementById("answer").textContent=message;
 if(message!=="JARVIS सुन रही है..."){
  document.body.classList.remove("listening");
 }
};

window.onNativeSpeechResult=function(text){
 document.body.classList.remove("listening");
 document.getElementById("message").value=text;
 sendMessage();
};

function showHistory(){
 try{
  let d=JSON.parse(Android.history());
  document.getElementById("answer").textContent=d.length
   ?d.slice().reverse().map(x=>x.time+"\\nआप: "+x.question+"\\nJARVIS: "+x.answer).join("\\n\\n")
   :"अभी कोई History नहीं है।";
 }catch(e){
  document.getElementById("answer").textContent="History नहीं खुली।";
 }
}

document.getElementById("message").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});
</script>
<script>
function openTools(){document.getElementById('tools').classList.add('open')}
function closeTools(){document.getElementById('tools').classList.remove('open')}

</script>
</body>
</html>
